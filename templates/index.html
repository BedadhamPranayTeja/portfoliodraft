<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pranay Teja Bedadham | Engineering Portfolio</title>
    <!-- Google Fonts: Plus Jakarta Sans & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"Fira Code"', 'monospace'],
            },
            boxShadow: {
              'glow-primary': '0 0 20px -3px rgba(139, 92, 246, 0.4)',
              'glow-secondary': '0 0 20px -3px rgba(6, 182, 212, 0.4)',
            }
          }
        }
      }
    </script>
    <!-- React & ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* Custom background styling with moving gradient shapes */
      body {
        background-color: #020617; /* slate-950 */
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow-x: hidden;
      }
      .bg-grid {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(30, 41, 59, 0.3) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
      }
      .glow-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.15;
        z-index: 0;
        pointer-events: none;
      }
      .glow-violet {
        background: radial-gradient(circle, #8b5cf6 0%, transparent 70%);
      }
      .glow-cyan {
        background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #020617;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-violet-500/30 selection:text-violet-200">
    <!-- Ambient glowing backgrounds -->
    <div class="relative w-full min-h-screen bg-grid">
      <div class="glow-blob glow-violet w-[500px] h-[500px] -top-40 -left-40"></div>
      <div class="glow-blob glow-cyan w-[600px] h-[600px] top-[40%] -right-40"></div>
      <div class="glow-blob glow-violet w-[500px] h-[500px] -bottom-40 left-[20%]"></div>

      <div id="root" class="relative z-10"></div>
    </div>

    <!-- React App Script -->
    {% raw %}
    <script type="text/babel">
      const { useState, useEffect } = React;

      // Reusable SVG Icons to keep the application dependencies self-contained
      const Icons = {
        Github: () => (
          <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path fillRule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.479C19.138 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z" clipRule="evenodd" />
          </svg>
        ),
        Linkedin: () => (
          <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path fillRule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clipRule="evenodd" />
          </svg>
        ),
        Mail: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        ),
        ExternalLink: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
        ),
        Calendar: () => (
          <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        ),
        Academic: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M12 14v7" />
          </svg>
        ),
        Briefcase: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        ),
        Code: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
          </svg>
        ),
        Star: () => (
          <svg className="w-4 h-4 text-amber-400 fill-amber-400" viewBox="0 0 20 20" fill="currentColor">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>
        ),
        Settings: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        ),
        LogOut: () => (
          <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
            <path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        )
      };

      function App() {
        // App States
        const [profile, setProfile] = useState(null);
        const [projects, setProjects] = useState([]);
        const [skills, setSkills] = useState([]);
        const [experience, setExperience] = useState([]);
        const [messages, setMessages] = useState([]);
        const [loading, setLoading] = useState(true);

        // Navigation state
        const [activeView, setActiveView] = useState("portfolio"); // "portfolio" or "admin"
        const [adminTab, setAdminTab] = useState("profile"); // "profile", "projects", "skills", "experience", "messages"
        const [selectedSkillsFilter, setSelectedSkillsFilter] = useState([]);
        const [activeProject, setActiveProject] = useState(null);

        const toggleSkillFilter = (skillName) => {
          setSelectedSkillsFilter(prev => {
            const lowerName = skillName.toLowerCase();
            if (prev.map(s => s.toLowerCase()).includes(lowerName)) {
              return prev.filter(s => s.toLowerCase() !== lowerName);
            } else {
              const match = skills.find(s => s.name.toLowerCase() === lowerName);
              return [...prev, match ? match.name : skillName];
            }
          });
        };

        // Auth States
        const [role, setRole] = useState("guest");
        const [showLoginModal, setShowLoginModal] = useState(false);
        const [username, setUsername] = useState("");
        const [password, setPassword] = useState("");
        const [loginError, setLoginError] = useState("");

        // Contact Form State
        const [contactForm, setContactForm] = useState({ sender_name: "", sender_email: "", message_text: "" });
        const [contactStatus, setContactStatus] = useState({ type: "", text: "" });

        // Modals / CRUD Form States
        const [isCrudOpen, setIsCrudOpen] = useState(false);
        const [crudType, setCrudType] = useState(""); // "project", "skill", "experience"
        const [crudData, setCrudData] = useState({});

        // Fetch Functions
        const fetchData = async () => {
          try {
            const [profileRes, projectsRes, skillsRes, expRes] = await Promise.all([
              fetch("/api/profile"),
              fetch("/api/projects"),
              fetch("/api/skills"),
              fetch("/api/experience")
            ]);

            const pData = await profileRes.json();
            const projData = await projectsRes.json();
            const sData = await skillsRes.json();
            const eData = await expRes.json();

            setProfile(pData);
            setProjects(projData);
            setSkills(sData);
            setExperience(eData);
          } catch (err) {
            console.error("Error loading portfolio data:", err);
          } finally {
            setLoading(false);
          }
        };

        const fetchMessages = async () => {
          if (role !== "admin") return;
          try {
            const res = await fetch("/api/messages");
            const data = await res.json();
            setMessages(data);
          } catch (err) {
            console.error("Error loading messages:", err);
          }
        };

        // Initial loading & Auth status
        useEffect(() => {
          fetch("/api/auth_status")
            .then(res => res.json())
            .then(data => {
              setRole(data.role);
              if (data.role === "admin") {
                fetchMessages();
              }
            });
          fetchData();
        }, []);

        // Refetch messages when role changes to admin
        useEffect(() => {
          if (role === "admin") {
            fetchMessages();
          } else {
            setActiveView("portfolio");
          }
        }, [role]);

        // Handlers
        const handleLoginSubmit = async (e) => {
          e.preventDefault();
          setLoginError("");
          try {
            const res = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
              setRole("admin");
              setShowLoginModal(false);
              setUsername("");
              setPassword("");
            } else {
              setLoginError(data.message || "Invalid admin credentials.");
            }
          } catch (err) {
            setLoginError("Server communication failed.");
          }
        };

        const handleLogout = async () => {
          await fetch("/api/logout", { method: "POST" });
          setRole("guest");
          setActiveView("portfolio");
        };

        const handleContactSubmit = async (e) => {
          e.preventDefault();
          setContactStatus({ type: "info", text: "Sending your message..." });
          try {
            const res = await fetch("/api/messages", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(contactForm)
            });
            if (res.ok) {
              setContactStatus({ type: "success", text: "Thank you! Your message was submitted successfully." });
              setContactForm({ sender_name: "", sender_email: "", message_text: "" });
            } else {
              const data = await res.json();
              setContactStatus({ type: "error", text: data.message || "Failed to submit message." });
            }
          } catch (err) {
            setContactStatus({ type: "error", text: "An error occurred. Please try again later." });
          }
        };

        // --- CRUD ACTIONS ---

        // Profile Update
        const handleProfileUpdateSubmit = async (e) => {
          e.preventDefault();
          try {
            const res = await fetch("/api/profile", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(profile)
            });
            if (res.ok) {
              alert("Profile updated successfully!");
              fetchData();
            } else {
              alert("Failed to update profile.");
            }
          } catch (err) {
            alert("Error sending update.");
          }
        };

        // General Open Create Form
        const openCreateForm = (type) => {
          setCrudType(type);
          let initialData = {};
          if (type === "project") {
            initialData = { id: null, title: "", description: "", tech_stack: "", image_url: "", github_url: "", live_url: "", featured: 0, system_diagram_url: "", star_situation: "", star_task: "", star_action: "", star_result: "" };
          } else if (type === "skill") {
            initialData = { id: null, name: "", category: "Languages", proficiency: 80 };
          } else if (type === "experience") {
            initialData = { id: null, company_or_institution: "", role: "", duration: "", description: "", type: "work", sort_order: 0 };
          }
          setCrudData(initialData);
          setIsCrudOpen(true);
        };

        // General Open Edit Form
        const openEditForm = (type, item) => {
          setCrudType(type);
          setCrudData({ ...item });
          setIsCrudOpen(true);
        };

        // General Submit Handle
        const handleCrudSubmit = async (e) => {
          e.preventDefault();
          const isEdit = crudData.id !== null;
          let url = "";
          let method = isEdit ? "PUT" : "POST";

          if (crudType === "project") {
            url = isEdit ? `/api/projects/${crudData.id}` : "/api/projects";
          } else if (crudType === "skill") {
            url = isEdit ? `/api/skills/${crudData.id}` : "/api/skills";
          } else if (crudType === "experience") {
            url = isEdit ? `/api/experience/${crudData.id}` : "/api/experience";
          }

          try {
            const res = await fetch(url, {
              method,
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(crudData)
            });
            if (res.ok) {
              setIsCrudOpen(false);
              fetchData();
            } else {
              alert("Error completing database operation.");
            }
          } catch (err) {
            console.error(err);
          }
        };

        // General Delete Handle
        const handleCrudDelete = async (type, id) => {
          if (!confirm(`Are you sure you want to delete this ${type}?`)) return;
          let url = "";
          if (type === "project") url = `/api/projects/${id}`;
          else if (type === "skill") url = `/api/skills/${id}`;
          else if (type === "experience") url = `/api/experience/${id}`;

          try {
            const res = await fetch(url, { method: "DELETE" });
            if (res.ok) {
              fetchData();
            } else {
              alert("Error deleting record.");
            }
          } catch (err) {
            console.error(err);
          }
        };

        // Message Inbox Operations
        const toggleMessageRead = async (msg) => {
          try {
            const newReadStatus = msg.is_read ? 0 : 1;
            const res = await fetch(`/api/messages/${msg.id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ is_read: newReadStatus })
            });
            if (res.ok) {
              fetchMessages();
            }
          } catch (err) {
            console.error(err);
          }
        };

        const deleteMessage = async (id) => {
          if (!confirm("Delete this message permanently?")) return;
          try {
            const res = await fetch(`/api/messages/${id}`, { method: "DELETE" });
            if (res.ok) {
              fetchMessages();
            }
          } catch (err) {
            console.error(err);
          }
        };

        // Group skills by category
        const skillsByCategory = skills.reduce((acc, skill) => {
          if (!acc[skill.category]) acc[skill.category] = [];
          acc[skill.category].push(skill);
          return acc;
        }, {});

        if (loading) {
          return (
            <div className="min-h-screen flex flex-col justify-center items-center gap-4 bg-slate-950">
              <div className="w-12 h-12 rounded-full border-4 border-violet-500 border-t-transparent animate-spin"></div>
              <p className="text-slate-400 font-mono text-sm tracking-wider">LOADING ENVIRONMENT...</p>
            </div>
          );
        }

        return (
          <div className="min-h-screen flex flex-col justify-between">
            {/* Header/Nav */}
            <header className="sticky top-0 bg-slate-950/80 backdrop-blur-md border-b border-slate-900 z-40 transition-colors">
              <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                <a href="#hero" className="flex items-center gap-2 group" onClick={() => setActiveView("portfolio")}>
                  <div className="w-9 h-9 rounded-lg bg-gradient-to-tr from-violet-600 to-cyan-500 flex items-center justify-center font-bold text-white shadow-glow-primary group-hover:scale-105 transition-transform">
                    P
                  </div>
                  <span className="font-bold text-lg tracking-wide bg-gradient-to-r from-slate-100 to-slate-300 bg-clip-text text-transparent group-hover:text-white transition-colors">
                    {profile?.name.split(" ")[0]} Teja
                  </span>
                </a>

                <nav className="flex items-center gap-6">
                  {activeView === "portfolio" ? (
                    <div className="hidden md:flex items-center gap-6 text-sm font-medium text-slate-400">
                      <a href="#about" className="hover:text-slate-200 transition-colors">About</a>
                      <a href="#skills" className="hover:text-slate-200 transition-colors">Skills</a>
                      <a href="#experience" className="hover:text-slate-200 transition-colors">Experience</a>
                      <a href="#projects" className="hover:text-slate-200 transition-colors">Projects</a>
                      <a href="#contact" className="hover:text-slate-200 transition-colors">Contact</a>
                    </div>
                  ) : (
                    <button 
                      onClick={() => setActiveView("portfolio")} 
                      className="text-xs font-mono bg-slate-900 border border-slate-800 text-slate-400 hover:text-white px-3 py-1.5 rounded transition-colors"
                    >
                      &larr; BACK TO PORTFOLIO
                    </button>
                  )}

                  {role === "admin" && (
                    <div className="flex items-center gap-3">
                      {activeView === "portfolio" ? (
                        <button
                          onClick={() => setActiveView("admin")}
                          className="flex items-center gap-1.5 text-xs font-mono font-bold bg-violet-950/40 border border-violet-800/80 text-violet-300 px-3 py-1.5 rounded-full hover:bg-violet-900/50 hover:border-violet-600 transition-all shadow-glow-primary"
                        >
                          <Icons.Settings />
                          ADMIN CONSOLE
                        </button>
                      ) : (
                        <span className="text-xs font-mono bg-green-950/40 border border-green-800/60 text-green-300 px-3 py-1.5 rounded-full shadow-inner">
                          ADMIN ACTIVE
                        </span>
                      )}

                      <button
                        onClick={handleLogout}
                        className="p-1.5 text-slate-500 hover:text-red-400 rounded-lg hover:bg-red-500/10 transition-all"
                        title="Log Out"
                      >
                        <Icons.LogOut />
                      </button>
                    </div>
                  )}
                </nav>
              </div>
            </header>

            {/* Main Content Areas */}
            <main className="flex-grow">
              {activeView === "portfolio" ? (
                /* --- PORTFOLIO VIEW --- */
                <div>
                  {/* Hero / Hero Section */}
                  <section id="hero" className="max-w-6xl mx-auto px-6 pt-16 pb-24 md:py-32 flex flex-col-reverse md:flex-row items-center gap-12 relative">
                    <div className="flex-1 space-y-6 text-center md:text-left">
                      <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-950/30 border border-violet-800/40 text-xs font-mono font-semibold text-violet-400">
                        <span className="w-2 h-2 rounded-full bg-violet-500 animate-pulse"></span>
                        Available for Projects
                      </div>
                      <h1 className="text-4xl md:text-6xl font-extrabold tracking-tight">
                        Hi, I'm <span className="bg-gradient-to-r from-violet-400 via-fuchsia-400 to-cyan-400 bg-clip-text text-transparent">{profile?.name}</span>
                      </h1>
                      <h2 className="text-xl md:text-2xl font-semibold text-slate-300 font-mono">
                        {profile?.title}
                      </h2>
                      <p className="text-slate-400 max-w-xl text-base leading-relaxed">
                        {profile?.bio}

                        type="button" 
                        onClick={() => setIsCrudOpen(false)}
                        className="px-4 py-2 bg-slate-800 text-slate-400 hover:text-slate-200 font-semibold text-xs rounded-lg transition-colors font-mono"
                      >
                        CANCEL
                      </button>
                      <button 
                        type="submit"
                        className="px-6 py-2 bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs rounded-lg transition-colors font-mono shadow-glow-primary"
                      >
                        SAVE RECORD
                      </button>
                    </div>

                  </form>
                </div>
              </div>
            )}

            {/* Modal: Project Case Study Detail (STAR + System Design) */}
            {activeProject && (
              <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div className="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl w-full max-w-4xl relative my-8 shadow-2xl focus:outline-none animate-fade-in">
                  {/* Close button */}
                  <button 
                    onClick={() => setActiveProject(null)}
                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-200 text-2xl font-bold bg-slate-950/60 border border-slate-850 w-9.5 h-9.5 rounded-full flex items-center justify-center transition-colors"
                  >
                    &times;
                  </button>

                  {/* Header Title */}
                  <div className="space-y-1 mb-6 border-b border-slate-850 pb-4 max-w-[90%]">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="font-mono text-xs text-violet-400 tracking-wider font-semibold uppercase">Project Detail / Case Study</span>
                      {activeProject.featured === 1 && (
                        <span className="bg-violet-950/50 text-violet-400 border border-violet-800/40 text-[9px] font-bold px-2 py-0.5 rounded font-mono shadow-glow-primary">FEATURED CASE STUDY</span>
                      )}
                    </div>
                    <h2 className="text-2xl md:text-3xl font-extrabold text-slate-100">{activeProject.title}</h2>
                  </div>

                  {/* System Design Diagram Banner */}
                  {activeProject.system_diagram_url && (
                    <div className="space-y-2 mb-6">
                      <label className="text-[10px] font-semibold font-mono text-cyan-400 uppercase tracking-wider flex items-center gap-1">
                        <Icons.Settings />
                        System Design & Architecture Diagram
                      </label>
                      <div className="w-full h-48 sm:h-64 md:h-80 rounded-2xl overflow-hidden bg-slate-950 border border-cyan-800/30 shadow-glow-secondary relative group/diagram">
                        <img 
                          src={activeProject.system_diagram_url} 
                          alt="System Design Diagram" 
                          className="w-full h-full object-contain p-4 transition-transform duration-500 group-hover/diagram:scale-[1.01]"
                          onError={(e) => {
                            e.target.style.display = 'none';
                          }}
                        />
                      </div>
                    </div>
                  )}

                  {/* Grid Layout */}
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    
                    {/* Left Column: Metadata & Links (1/3 width) */}
                    <div className="space-y-6 bg-slate-950/30 p-6 rounded-2xl border border-slate-800 h-fit text-sm lg:col-span-1">
                      <div className="space-y-2">
                        <label className="text-[9px] font-semibold font-mono text-slate-500 uppercase tracking-wider block">Project Cover</label>
                        <div className="h-40 md:h-48 rounded-xl overflow-hidden bg-slate-950 border border-slate-850 relative">
                          <img 
                            src={activeProject.image_url || "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=600"} 
                            alt="Cover" 
                            className="w-full h-full object-cover"
                          />
                        </div>
                      </div>

                      <div className="space-y-2">
                        <label className="text-[9px] font-semibold font-mono text-slate-500 uppercase tracking-wider block">Description</label>
                        <p className="text-slate-400 text-xs leading-relaxed">{activeProject.description}</p>
                      </div>

                      <div className="space-y-2">
                        <label className="text-[9px] font-semibold font-mono text-slate-500 uppercase tracking-wider block">Tech Stack</label>
                        <div className="flex flex-wrap gap-1.5">
                          {activeProject.tech_stack.split(',').map((tech, idx) => (
                            <span key={idx} className="bg-slate-950 text-[10px] font-mono text-cyan-400 px-2 py-0.5 rounded border border-slate-800">
                              {tech.trim()}
                            </span>
                          ))}
                        </div>
                      </div>

                      <div className="space-y-3 pt-4 border-t border-slate-850">
                        {activeProject.github_url && (
                          <a 
                            href={activeProject.github_url} 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="flex items-center justify-center gap-2 w-full py-3 bg-slate-900 border border-slate-800 hover:bg-slate-800/80 text-white font-medium text-xs font-mono rounded-xl transition-all"
                          >
                            <Icons.Github />
                            VIEW GITHUB CODE
                          </a>
                        )}
                        {activeProject.live_url && (
                          <a 
                            href={activeProject.live_url} 
                            target="_blank" 
                            rel="noopener noreferrer" 
                            className="flex items-center justify-center gap-2 w-full py-3 bg-gradient-to-r from-violet-600 to-cyan-500 hover:from-violet-500 hover:to-cyan-400 text-white font-medium text-xs font-mono rounded-xl transition-all shadow-glow-primary hover:-translate-y-0.5"
                          >
                            <Icons.ExternalLink />
                            EXPLORE LIVE DEMO
                          </a>
                        )}
                      </div>
                    </div>

                    {/* Right Column: STAR Case Study (2/3 width) */}
                    <div className="lg:col-span-2 space-y-6">
                      
                      {/* STAR Method Case Study */}
                      <div className="space-y-4">
                        <h3 className="font-bold font-mono text-sm text-violet-400 border-b border-slate-850 pb-2 flex items-center gap-1.5 uppercase">
                          <Icons.Academic />
                          Case Study (STAR Methodology)
                        </h3>
                        
                        {activeProject.star_situation ? (
                          <div className="grid grid-cols-1 gap-4 font-sans text-sm">
                            <div className="bg-slate-950/45 p-4 rounded-xl border border-slate-850">
                              <div className="font-mono text-[9px] font-bold text-slate-500 tracking-widest uppercase mb-1">S - Situation (Context)</div>
                              <p className="text-slate-300 leading-relaxed text-xs">{activeProject.star_situation}</p>
                            </div>
                            <div className="bg-slate-950/45 p-4 rounded-xl border border-slate-850">
                              <div className="font-mono text-[9px] font-bold text-cyan-400 tracking-widest uppercase mb-1">T - Task (Goal / Challenge)</div>
                              <p className="text-slate-300 leading-relaxed text-xs">{activeProject.star_task}</p>
                            </div>
                            <div className="bg-slate-950/45 p-4 rounded-xl border border-slate-850">
                              <div className="font-mono text-[9px] font-bold text-violet-400 tracking-widest uppercase mb-1">A - Action (Engineering Work)</div>
                              <p className="text-slate-300 leading-relaxed text-xs">{activeProject.star_action}</p>
                            </div>
                            <div className="bg-slate-950/45 p-4 rounded-xl border border-slate-850 border-emerald-950/40">
                              <div className="font-mono text-[9px] font-bold text-emerald-400 tracking-widest uppercase mb-1">R - Result (Impact & Metrics)</div>
                              <p className="text-slate-205 font-semibold leading-relaxed text-xs">{activeProject.star_result}</p>
                            </div>
                          </div>
                        ) : (
                          <div className="bg-slate-950/45 p-4 rounded-xl border border-slate-850">
                            <p className="text-slate-400 text-xs leading-relaxed">{activeProject.description}</p>
                            <p className="text-[10px] font-mono text-slate-500 pt-3 italic">Full STAR case study write-up pending for this entry.</p>
                          </div>
                        )}
                      </div>

                    </div>

                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
    {% endraw %}
  </body>
</html>
