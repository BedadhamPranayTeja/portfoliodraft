<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      function App() {
        const [projects, setProjects] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          fetch("/api/projects")
            .then((response) => response.json())
            .then((data) => {
              setProjects(data);
              setLoading(false);
            })
            .catch((error) => {
              console.error("Error fetching projects:", error);
              setLoading(false);
            });
        }, []);

        return (
          <div className="max-w-5xl mx-auto px-4 py-12">
            <header className="mb-12 border-b pb-6">
              <h1 className="text-4xl font-bold text-gray-900 mb-2">
                B.Tech Engineering Portfolio
              </h1>
              <p className="text-xl text-gray-600">
                Building software, robotics, and full-stack applications.
              </p>
            </header>

            <main>
              <h2 className="text-2xl font-semibold mb-6">Recent Projects</h2>
              {loading ? (
                <p className="text-gray-500">Loading projects...</p>
              ) : projects.length === 0 ? (
                <p className="text-gray-500">
                  No projects found. Did you run init_db.py?
                </p>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {projects.map((project) => (
                    <div
                      key={project.id}
                      className="bg-white p-6 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition-shadow"
                    >
                      <h3 className="text-xl font-bold mb-2">
                        {project.title}
                      </h3>
                      <p className="text-gray-600 mb-4">
                        {project.description}
                      </p>
                      <div className="text-sm font-medium text-blue-600 bg-blue-50 inline-block px-3 py-1 rounded-full">
                        {project.tech_stack}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
